version: '3.8'

services:
  # 1. Central Admin & POS Web Frontend (Nginx)
  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://localhost:54321}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-demo-anon-key}
    container_name: aldeeb-admin-dashboard
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-http://localhost:54321}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-demo-anon-key}
    depends_on:
      - vision-service
      - postgrest
    networks:
      - aldeeb-network

  # 2. Local Edge Vision, Footfall & Loss Prevention Gateway
  vision-service:
    build:
      context: .
      dockerfile: Dockerfile.vision
    container_name: aldeeb-vision-edge
    restart: unless-stopped
    ports:
      - "${VISION_PORT:-8095}:8095"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${VISION_LOG_LEVEL:-INFO}
      - CAMERA_01_RTSP=${CAMERA_01_RTSP:-rtsp://192.168.10.101:554/live}
      - CAMERA_02_RTSP=${CAMERA_02_RTSP:-rtsp://192.168.10.102:554/live}
      - CAMERA_03_RTSP=${CAMERA_03_RTSP:-rtsp://192.168.10.103:554/live}
      - CAMERA_04_RTSP=${CAMERA_04_RTSP:-rtsp://192.168.10.104:554/live}
    volumes:
      - vision-logs:/app/logs
    networks:
      - aldeeb-network

  # 3. PostgREST API Engine (Supabase-compatible REST Gateway)
  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: aldeeb-postgrest
    restart: unless-stopped
    ports:
      - "${POSTGREST_PORT:-54321}:3000"
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-aldeeb_admin}:${POSTGRES_PASSWORD:-aldeeb_secure_pass_2026}@postgres-branch-db:5432/${POSTGRES_DB:-aldeeb_mall_prod}
      PGRST_DB_SCHEMAS: public,branch_dam_01
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-aldeeb-mall-secure-jwt-secret-key-32chars-min-length-2026}
    depends_on:
      postgres-branch-db:
        condition: service_healthy
    networks:
      - aldeeb-network

  # 4. Branch Operational Database Engine (PostgreSQL 16)
  postgres-branch-db:
    image: postgres:16-alpine
    container_name: aldeeb-branch-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aldeeb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aldeeb_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aldeeb_mall_prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aldeeb_admin} -d ${POSTGRES_DB:-aldeeb_mall_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aldeeb-network

networks:
  aldeeb-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  vision-logs:
    driver: local
