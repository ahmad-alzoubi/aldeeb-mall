<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aldeeb_mall_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>الديب مول | Aldeeb Mall</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      color: white;
      transition: opacity 0.4s ease-out;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
      animation: pulse-glow 2s infinite ease-in-out;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 15px 35px 0px rgba(37, 99, 235, 0.7); }
    }
    .brand-title {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #94A3B8;
      font-weight: 600;
    }
    .spinner {
      margin-top: 30px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="logo-box">🛒</div>
    <div class="brand-title">الديب مول</div>
    <div class="brand-sub">جاري تجهيز المتجر وتحديث العروض...</div>
    <div class="spinner"></div>
  </div>

  <script>
    const observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        const splash = document.getElementById('loading-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    window.addEventListener('error', function(e) {
      console.error("Flutter App Error:", e);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
