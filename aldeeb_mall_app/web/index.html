  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="الديب مول">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>الديب مول | Aldeeb Mall</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      color: white;
      transition: opacity 0.4s ease-out;
    }
    .logo-box {
      width: 90px;
      height: 90px;
      background: #000000;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 10px 30px -5px rgba(56, 189, 248, 0.45);
      animation: pulse-glow 2s infinite ease-in-out;
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.35); }
      50% { transform: scale(1.05); box-shadow: 0 16px 36px 0px rgba(239, 68, 68, 0.5); }
    }
    .brand-title {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #94A3B8;
      font-weight: 600;
    }
    .spinner {
      margin-top: 30px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="logo-box">
      <img src="icons/Icon-192.png" alt="شعار الديب مول DEB" />
    </div>
    <div class="brand-title">الديب مول</div>
    <div class="brand-sub">جاري تجهيز المتجر وتحديث العروض...</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Force unregister legacy service workers & clear CacheStorage to guarantee latest bundle
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (let i = 0; i < keys.length; i++) {
          caches.delete(keys[i]);
        }
      });
    }

    const observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        const splash = document.getElementById('loading-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    window.addEventListener('error', function(e) {
      console.error("Flutter App Error:", e);
    });
  </script>
  <script src="flutter_bootstrap.js?v=20261101_0358" async></script>
</body>
</html>
